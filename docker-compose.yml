networks:
  data-pipeline-net:
    driver: bridge

volumes:
  minio_data:
  spark_data:

services:
  # ==========================================
  # 1. MESSAGE BROKER: Apache Kafka (KRaft)
  # ==========================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: clickstream_kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - data-pipeline-net

  # ==========================================
  # 2. IMMUTABLE LAKEHOUSE STORAGE: MinIO (S3)
  # ==========================================
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: clickstream_minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Web Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - data-pipeline-net

  # ==========================================
  # 3. DISTRIBUTED COMPUTE: Apache Spark 3.5
  # ==========================================
  spark-master:
    image: apache/spark:3.5.0
    container_name: clickstream_spark_master
    environment:
      - SPARK_NO_DAEMONIZE=true
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"   # Spark Master UI
    volumes:
      - spark_data:/opt/spark/work
      - ../spark:/opt/spark/apps
    networks:
      - data-pipeline-net

  spark-worker:
    image: apache/spark:3.5.0
    container_name: clickstream_spark_worker
    depends_on:
      - spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081"   # Spark Worker UI
    volumes:
      - spark_data:/opt/spark/work
      - ../spark:/opt/spark/apps
    networks:
      - data-pipeline-net

  # ==========================================
  # 4. BUSINESS INTELLIGENCE & SERVING: Metabase
  # ==========================================
  metabase:
    image: metabase/metabase:latest
    container_name: clickstream_metabase
    ports:
      - "3001:3000"
    environment:
      MB_DB_FILE: /tmp/metabase.db
    networks:
      - data-pipeline-net
